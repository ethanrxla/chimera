services:
  chimera-core:
    build:
      context: .
      dockerfile: chimera/docker/core.Dockerfile
    container_name: chimera-core
    working_dir: /app
    volumes:
      - ./chimera/chimera-core:/app/chimera-core
      - ./tools:/app/tools
      - ./scope.yml:/app/chimera-core/scope.yml
      - ./kali_data/artifacts:/artifacts
      - ./kali_data/cache:/cache
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - CHIMERA_ARTIFACTS_DIR=/artifacts
      - CHIMERA_CACHE_DIR=/cache
      - PYTHONPATH=/app/chimera-core
      - DOCKER_HOST=unix:///var/run/docker.sock
      - STRIX_LLM=${STRIX_LLM:-openai/gpt-4o-mini}
      - STRIX_IMAGE=${STRIX_IMAGE:-ghcr.io/usestrix/strix-sandbox:0.1.13}
      - CHIMERA_SHANNON_ENABLED=${CHIMERA_SHANNON_ENABLED:-true}
      - CHIMERA_SHANNON_VERIFY_AVAILABILITY=${CHIMERA_SHANNON_VERIFY_AVAILABILITY:-true}
      - SHANNON_BASE_URL=${SHANNON_BASE_URL:-http://shannon:8080}
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
      - ZAP_BASE_URL=${ZAP_BASE_URL:-http://zap:8090}
      - ZAP_API_KEY=${ZAP_API_KEY:-chimera-zap-key}
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    command: ["bash", "-lc", "cd chimera-core && /opt/venv/bin/uvicorn chimera_core.api.app:create_app --factory --host 0.0.0.0 --port 8000"]
    restart: unless-stopped

  chimera-cli:
    build:
      context: .
      dockerfile: chimera/docker/cli.Dockerfile
    container_name: chimera-cli
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - CHIMERA_API_BASE=http://chimera-core:8000/v1
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - chimera-core
    stdin_open: true
    tty: true
    command: ["bash", "-lc", "exec sleep infinity"]
    restart: unless-stopped

  chimera-ui:
    build:
      context: .
      dockerfile: chimera/docker/ui.Dockerfile
    container_name: chimera-ui
    working_dir: /app
    volumes:
      - ./chimera/chimera-ui:/app/chimera-ui
      - ./kali_data/artifacts:/artifacts
    environment:
      - CHIMERA_API_URL=http://chimera-core:8000/v1
    depends_on:
      - chimera-core
    command: ["bash", "-lc", "cd chimera-ui && xvfb-run -a python3 launcher.py"]
    restart: unless-stopped

  shannon:
    build:
      context: ./tools/shannon-svc
    container_name: shannon
    volumes:
      - ./kali_data/artifacts:/artifacts
    environment:
      - SHANNON_PROVIDER=${SHANNON_PROVIDER:-openai_compatible}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - SHANNON_OPENAI_BASE_URL=${SHANNON_OPENAI_BASE_URL:-http://ollama:11434/v1}
      - SHANNON_OPENAI_API_KEY=${SHANNON_OPENAI_API_KEY:-dummy}
      - SHANNON_AGENT_ARTIFACT_ROOT=${SHANNON_AGENT_ARTIFACT_ROOT:-/artifacts}
      - CHIMERA_ARTIFACTS_ROOT=${CHIMERA_ARTIFACTS_ROOT:-/artifacts}
      - SHANNON_PLANNER_MODEL=${SHANNON_PLANNER_MODEL:-qwen2.5-coder:7b}
      - SHANNON_EXECUTOR_MODEL=${SHANNON_EXECUTOR_MODEL:-qwen2.5-coder:7b}
      - SHANNON_VALIDATOR_MODEL=${SHANNON_VALIDATOR_MODEL:-qwen2.5-coder:7b}
      - SHANNON_ORACLE_ENABLED=${SHANNON_ORACLE_ENABLED:-true}
      - SHANNON_ORACLE_PROVIDER=${SHANNON_ORACLE_PROVIDER:-openai}
      - SHANNON_ORACLE_MODEL=${SHANNON_ORACLE_MODEL:-gpt-5.4}
      - SHANNON_ORACLE_REASONING=${SHANNON_ORACLE_REASONING:-medium}
      - SHANNON_ORACLE_BASE_URL=${SHANNON_ORACLE_BASE_URL:-}
      - SHANNON_ORACLE_API_KEY=${SHANNON_ORACLE_API_KEY:-}
      - SHANNON_ANTHROPIC_PROMPT_CACHING=${SHANNON_ANTHROPIC_PROMPT_CACHING:-true}
      - SHANNON_ANTHROPIC_CACHE_TTL=${SHANNON_ANTHROPIC_CACHE_TTL:-5m}
      - SHANNON_ORACLE_MAX_TURNS=${SHANNON_ORACLE_MAX_TURNS:-6}
      - SHANNON_ORACLE_MAX_TOOL_CALLS=${SHANNON_ORACLE_MAX_TOOL_CALLS:-12}
      - SHANNON_ORACLE_MAX_RETRIES=${SHANNON_ORACLE_MAX_RETRIES:-2}
      - SHANNON_PROMPT_DIR=${SHANNON_PROMPT_DIR:-/app/prompts}
      - SHANNON_AGENT_COMPACTION_THRESHOLD=${SHANNON_AGENT_COMPACTION_THRESHOLD:-6}
      - SHANNON_AGENT_COMPACTION_KEEP_RECENT=${SHANNON_AGENT_COMPACTION_KEEP_RECENT:-2}
      - SHANNON_LOCAL_HYPOTHESIS_ENABLED=${SHANNON_LOCAL_HYPOTHESIS_ENABLED:-true}
      - SHANNON_LOCAL_HYPOTHESIS_MAX_FINDINGS=${SHANNON_LOCAL_HYPOTHESIS_MAX_FINDINGS:-8}
      - SHANNON_LOCAL_HYPOTHESIS_MAX_CHECKS=${SHANNON_LOCAL_HYPOTHESIS_MAX_CHECKS:-6}
      - SHANNON_BROWSER_HEADLESS=${SHANNON_BROWSER_HEADLESS:-true}
      - SHANNON_BROWSER_DEVTOOLS=${SHANNON_BROWSER_DEVTOOLS:-false}
      - SHANNON_BROWSER_SLOW_MO_MS=${SHANNON_BROWSER_SLOW_MO_MS:-0}
      - SHANNON_BROWSER_EXECUTOR_MODE=${SHANNON_BROWSER_EXECUTOR_MODE:-mediated}
      - SHANNON_MAX_TOKENS=${SHANNON_MAX_TOKENS:-8096}
      - SHANNON_TEMPERATURE=${SHANNON_TEMPERATURE:-0.1}
      - SHANNON_PLANNER_TEMPERATURE=${SHANNON_PLANNER_TEMPERATURE:-0.0}
      - SHANNON_EXECUTOR_TEMPERATURE=${SHANNON_EXECUTOR_TEMPERATURE:-0.1}
      - SHANNON_VALIDATOR_TEMPERATURE=${SHANNON_VALIDATOR_TEMPERATURE:-0.0}
      - HEXSTRIKE_BASE_URL=http://hexstrike:8888
      - HEXSTRIKE_ENABLED=${HEXSTRIKE_ENABLED:-true}
      - HEXSTRIKE_MAX_TOOL_TURNS=${HEXSTRIKE_MAX_TOOL_TURNS:-3}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
    ports:
      - "${SHANNON_HOST_PORT:-18080}:8080"
    depends_on:
      - hexstrike
    restart: unless-stopped

  sec-llm:
    image: vllm/vllm-openai:latest
    container_name: sec-llm
    profiles: ["local-llm"]
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      - LOCAL_LLM_PRESET=${LOCAL_LLM_PRESET:-whiterabbit-qwen}
      - LOCAL_LLM_MODEL_ID=${LOCAL_LLM_MODEL_ID:-}
      - LOCAL_LLM_SERVED_MODEL_NAME=${LOCAL_LLM_SERVED_MODEL_NAME:-}
      # 4096 is a safe starting context; increase for larger VRAM (e.g. 8192 on 12 GB)
      - LOCAL_LLM_MAX_MODEL_LEN=${LOCAL_LLM_MAX_MODEL_LEN:-4096}
      # GPU memory fraction: 0.82 * 12 GB ≈ 9.84 GB reserved; safe for 13B AWQ on RTX 5070
      - LOCAL_LLM_GPU_MEMORY_UTILIZATION=${LOCAL_LLM_GPU_MEMORY_UTILIZATION:-0.82}
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    ports:
      - "8001:8000"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint:
      - /bin/sh
      - -lc
    command: >
      PRESET="$${LOCAL_LLM_PRESET:-whiterabbit-qwen}";
      MODEL_ID="$${LOCAL_LLM_MODEL_ID:-}";
      SERVED_NAME="$${LOCAL_LLM_SERVED_MODEL_NAME:-}";
      QUANT="";
      if [ -z "$$MODEL_ID" ]; then
        case "$$PRESET" in
          whiterabbit-qwen)
            MODEL_ID="TheBloke/Mistral-7B-Instruct-v0.3-AWQ";
            DEFAULT_NAME="Mistral-7B-Instruct-v0.3-AWQ";
            QUANT="awq"
            ;;
          whiterabbit-13b)
            MODEL_ID="TheBloke/WhiteRabbitNeo-13B-AWQ";
            DEFAULT_NAME="WhiteRabbitNeo-13B-AWQ";
            QUANT="awq"
            ;;
          whiterabbit-llama-8b)
            MODEL_ID="WhiteRabbitNeo/Llama-3.1-WhiteRabbitNeo-2-8B";
            DEFAULT_NAME="Llama-3.1-WhiteRabbitNeo-2-8B"
            ;;
          deephat)
            MODEL_ID="DeepHat/DeepHat-V1-7B";
            DEFAULT_NAME="DeepHat-V1-7B"
            ;;
          *)
            echo "Unsupported LOCAL_LLM_PRESET: $$PRESET" >&2;
            exit 1
            ;;
        esac;
      else
        DEFAULT_NAME="$${MODEL_ID##*/}";
        case "$$MODEL_ID" in *AWQ*|*awq*) QUANT="awq" ;; esac;
      fi;
      if [ -z "$$SERVED_NAME" ]; then
        SERVED_NAME="$$DEFAULT_NAME";
      fi;
      QUANT_FLAG="";
      if [ -n "$$QUANT" ]; then QUANT_FLAG="--quantization $$QUANT"; fi;
      exec python3 -m vllm.entrypoints.openai.api_server \
        --model "$$MODEL_ID" \
        --served-model-name "$$SERVED_NAME" \
        --host 0.0.0.0 --port 8000 \
        --max-model-len "$${LOCAL_LLM_MAX_MODEL_LEN:-4096}" \
        --gpu-memory-utilization "$${LOCAL_LLM_GPU_MEMORY_UTILIZATION:-0.82}" \
        --enforce-eager \
        $${QUANT_FLAG}
    networks:
      default:
        aliases:
          - deephat
    restart: unless-stopped

  hexstrike:
    build:
      context: ./tools/hexstrike-mcp
    container_name: hexstrike
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY:-}
      - SERPAPI_API_KEY=${SERPAPI_API_KEY:-}
      - LLM_API_BASE=${LLM_API_BASE:-http://ollama:11434/v1}
      - LLM_API_KEY=${LLM_API_KEY:-dummy}
      - LLM_MODEL=${LLM_MODEL:-qwen2.5:7b}
    ports:
      - "8888:8888"
    restart: unless-stopped

  zap:
    image: zaproxy/zap-stable
    container_name: zap
    command: >
      zap.sh -daemon -port 8090 -host 0.0.0.0
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
      -config api.key=${ZAP_API_KEY:-chimera-zap-key}
    ports:
      - "8090:8090"
    restart: unless-stopped

  juice-shop:
    image: bkimminich/juice-shop
    container_name: juice-shop
    profiles: ["lab"]
    ports:
      - "3000:3000"
    restart: unless-stopped

  metasploitable2:
    image: tleemcjr/metasploitable2
    container_name: metasploitable2
    profiles: ["lab"]
    ports:
      - "2222:22"
      - "8081:80"
      - "8443:443"
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama-gpu
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=300s
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_NUM_CTX=24576
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  ollama-models:
