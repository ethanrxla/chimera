services:
  chimera-core:
    build:
      context: .
      dockerfile: chimera/docker/core.Dockerfile
    container_name: chimera-core
    working_dir: /app
    volumes:
      - ./chimera/chimera-core:/app/chimera-core
      - ./tools:/app/tools
      - ./scope.yml:/app/chimera-core/scope.yml
      - ./kali_data/artifacts:/artifacts
      - ./kali_data/cache:/cache
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - CHIMERA_ARTIFACTS_DIR=/artifacts
      - CHIMERA_CACHE_DIR=/cache
      - PYTHONPATH=/app/chimera-core
      - DOCKER_HOST=unix:///var/run/docker.sock
      - STRIX_LLM=${STRIX_LLM:-openai/gpt-5}
      - STRIX_IMAGE=${STRIX_IMAGE:-ghcr.io/usestrix/strix-sandbox:0.1.10}
      - CHIMERA_SHANNON_ENABLED=${CHIMERA_SHANNON_ENABLED:-true}
      - CHIMERA_SHANNON_VERIFY_AVAILABILITY=${CHIMERA_SHANNON_VERIFY_AVAILABILITY:-true}
      - SHANNON_BASE_URL=${SHANNON_BASE_URL:-http://localhost:8080}
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    command: ["bash", "-lc", "cd chimera-core && /opt/venv/bin/uvicorn chimera_core.api.app:create_app --factory --host 0.0.0.0 --port 8000"]
    restart: unless-stopped

  chimera-cli:
    build:
      context: .
      dockerfile: chimera/docker/cli.Dockerfile
    container_name: chimera-cli
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - CHIMERA_API_BASE=http://chimera-core:8000/v1
    depends_on:
      - chimera-core
    stdin_open: true
    tty: true
    command: ["bash", "-lc", "exec sleep infinity"]
    restart: unless-stopped

  chimera-ui:
    build:
      context: .
      dockerfile: chimera/docker/ui.Dockerfile
    container_name: chimera-ui
    working_dir: /app
    volumes:
      - ./chimera/chimera-ui:/app/chimera-ui
      - ./kali_data/artifacts:/artifacts
    environment:
      - CHIMERA_API_URL=http://chimera-core:8000/v1
    depends_on:
      - chimera-core
    command: ["bash", "-lc", "cd chimera-ui && xvfb-run -a python3 launcher.py"]
    restart: unless-stopped

  juice-shop:
    image: bkimminich/juice-shop
    container_name: juice-shop
    profiles: ["lab"]
    ports:
      - "3000:3000"
    restart: unless-stopped

  metasploitable2:
    image: tleemcjr/metasploitable2
    container_name: metasploitable2
    profiles: ["lab"]
    ports:
      - "2222:22"
      - "8080:80"
      - "8443:443"
    restart: unless-stopped
