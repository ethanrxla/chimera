# ScholarCal - full-scope security assessment
# Owner: authorized tester (site owner)
# Date: 2026-04-02
#
# NOTE: allowlist entries are ALSO the planner's target list.
# - URLs with /api → api_rest chain (autoswagger, bola_validator, rate_limit_validator, shannon)
# - URLs with https:// → web_app chain (strix, browser, shannon)
# - Bare domain (no scheme) → subdomain chain (subfinder, zypheron, shannon)
# Hostname matching covers all paths — no need for wildcard entries here.

allowlist:
  # web_app target: strix → browser → shannon
  - "https://scholarcal.com"
  # api_rest target: autoswagger → bola_validator → rate_limit_validator → shannon
  - "https://scholarcal.com/api"
  # subdomain target: subfinder → zypheron → shannon
  - "scholarcal.com"

denylist:
  # Third-party OAuth/backend — do not test directly
  - "accounts.google.com"
  - "login.microsoftonline.com"
  - "canvas.instructure.com"
  - "supabase.co"
  - "supabase.io"

rate_limits:
  requests_per_second: 2
  concurrency: 3
  max_requests_per_scan: 5000

allowed_methods:
  - "GET"
  - "HEAD"
  - "OPTIONS"
  - "POST"
  - "PUT"
  - "PATCH"
  - "DELETE"

tool_settings:
  strix:
    crawl_depth: 4
    follow_redirects: true
    check_robots_txt: true

  zypheron:
    aggressive_mode: false
    subdomain_bruteforce: false
    port_scan_range: "common"

  vibepentester:
    aggressive_mode: false
    enable_sqlmap: false
    enable_fuzzing: true

  autoswagger:
    base_path: "/api"
    auth_header: "Authorization"
    auth_scheme: "Bearer"

# Planner context — passed to generate_plan so bola_validator and jwt_validator
# are included in the api_rest chain.
#
# Credentials are Supabase SSR cookie sessions (expire ~1h).
# To refresh: POST https://eyeiwbznnhsdefhqjqow.supabase.co/auth/v1/token?grant_type=password
#   body: {"email":"...","password":"TestPass123!"}
# Then URL-encode the full response JSON and set as the cookie value below.
#
# user_a: chimera_idor_a2@mailinator.com  (event owner, UUID 420576bd-...)
# user_b: chimera_idor_b@mailinator.com   (peer, UUID 1994ca59-...)
# object_id: event created by user_a during IDOR verification (2026-04-02)
context:
  validation_inputs:
    target_endpoint: "https://scholarcal.com/api/events"
    object_id: "472ffc8c-f78a-411b-8a17-463a1981f57b"
    user_a_creds:
      headers:
        Cookie: "sb-eyeiwbznnhsdefhqjqow-auth-token=REPLACE_WITH_USER_A_SESSION"
    user_b_creds:
      headers:
        Cookie: "sb-eyeiwbznnhsdefhqjqow-auth-token=REPLACE_WITH_USER_B_SESSION"

# Attack surface notes (for Shannon context):
# 1. BOLA/IDOR: PATCH/DELETE /api/events?id=<uuid> — can user A touch user B's events?
# 2. Unauthenticated iCal: GET /api/calendar/ical?token=X — feed token entropy/reuse
# 3. Rate limit on POST /api/mail/send — email abuse
# 4. Mass assignment: PATCH /api/events with undocumented fields
# 5. Supabase RLS bypass — all isolation relies on row-level policies
